# Deploy com gate humano G6.
# Configure em Settings → Environments:
#   staging     -> Required reviewers (ex.: tech lead, QA)
#   production  -> Required reviewers (ex.: gerente de projeto, arquiteto) + "Prevent self-review"
# O workflow só roda quando um humano publica uma Release, e cada environment pausa para aprovação.
#
# Exemplo para Azure App Service (containers) com login OIDC. Ajuste os passos "Deploy" ao seu alvo.
# Variáveis (Settings → Variables): AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_WEBAPP_NAME (por environment)
name: cd

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Script de migração idempotente
        run: |
          dotnet tool install --global dotnet-ef
          # Ajuste --project/--startup-project ao seu repositório
          dotnet ef migrations script --idempotent -o migrations.sql || echo "Sem migrations EF neste projeto"

      - uses: actions/upload-artifact@v4
        with:
          name: migrations
          path: migrations.sql
          if-no-files-found: ignore

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging          # ⛔ G6 — aprovação humana
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Aplique aqui migrations.sql no banco de staging com a ferramenta do seu ambiente.
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 6 "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: production       # ⛔ G6 — aprovação humana
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          images: ${{ env.IMAGE }}:${{ needs.build.outputs.tag }}
      - name: Smoke test
        run: curl --fail --retry 10 --retry-delay 6 "https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net/health"
