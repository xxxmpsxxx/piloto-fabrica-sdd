name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Há projetos .NET?
        id: check
        run: |
          if git ls-files '*.csproj' | grep -q .; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; echo "Nenhum projeto .NET ainda — CI passa sem build."; fi

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.has == 'true'
        with:
          global-json-file: global.json

      - name: Build e testes
        if: steps.check.outputs.has == 'true'
        run: |
          dotnet restore
          dotnet build --no-restore -c Release
          dotnet test --no-build -c Release --collect:"XPlat Code Coverage" --results-directory ./TestResults

      - name: Pacotes vulneráveis
        if: steps.check.outputs.has == 'true'
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt
          if grep -qE '\b(High|Critical)\b' vuln.txt; then echo "::error::Dependência com vulnerabilidade High/Critical"; exit 1; fi

      - uses: actions/upload-artifact@v4
        if: always() && steps.check.outputs.has == 'true'
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: ignore
